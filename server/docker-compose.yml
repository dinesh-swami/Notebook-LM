services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notebooklm-postgres-build
    environment:
      POSTGRES_DB: notebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - notebook_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notebook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  notebook_pg_data:
